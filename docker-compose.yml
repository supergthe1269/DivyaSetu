# DivyaSetu — PostgreSQL 16 + PostGIS (reproducible dev DB for the team)
# Usage:  docker compose up -d db
# The postgis/postgis image ships with the geometry + ST_DWithin functions out of the box.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: divyasetu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: divyasetu
      POSTGRES_PASSWORD: divyasetu
      POSTGRES_DB: divyasetu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divyasetu -d divyasetu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: